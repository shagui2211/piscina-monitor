<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de temas de las TV</title>
<style>
:root{--bg:#eef1f4;--pn:#ffffff;--tx:#1f2a2a;--mu:#6b7c7a;--bd:#d5dde0;--ac:#2a8f78;--ac2:#1f6f5c;--wa:#c0392b;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
header h1{font-size:16px;margin:0 10px 0 0}
button,select,input{font:inherit}
button{border:1px solid var(--bd);background:#f6f8f9;border-radius:7px;padding:5px 10px;cursor:pointer;color:var(--tx)}
button:hover{background:#e8eef0}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.pri:hover{background:var(--ac2)}
button.del{color:var(--wa)}
button.sm{padding:2px 7px;font-size:12px}
select,input[type=text],input[type=number],input[type=date],input[type=time]{border:1px solid var(--bd);border-radius:6px;padding:4px 6px;background:#fff;color:var(--tx);min-width:0}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--bd);border-radius:5px;background:none;cursor:pointer}
main{flex:1;display:flex;min-height:0}
#side{width:372px;flex:none;overflow:auto;padding:10px;border-right:1px solid var(--bd);background:var(--bg)}
details{background:var(--pn);border:1px solid var(--bd);border-radius:9px;margin-bottom:8px}
summary{cursor:pointer;padding:8px 10px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--mu)}details[open]>summary::before{content:"▾ "}
.bd{padding:2px 10px 10px}
.r{display:flex;align-items:center;gap:8px;margin:6px 0}
.r>label{width:104px;flex:none;color:var(--mu);font-size:12.5px}
.r>.v{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.r input[type=range]{flex:1;min-width:0}
.r input[type=number]{width:64px}
.r input[type=text]{flex:1}
.nota{color:var(--mu);font-size:12px;margin:4px 0}
.lista{border:1px solid var(--bd);border-radius:7px;overflow:hidden;margin:6px 0}
.it{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--bd);cursor:pointer;background:#fff}
.it:last-child{border-bottom:0}.it.sel{background:#e3f4ef}.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}
.pk div{border:1px solid var(--bd);border-radius:6px;background:#51648a;cursor:pointer;padding:2px}.pk div.sel{outline:2px solid var(--ac)}
.pk svg{width:100%;height:auto;display:block}
.sw{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.sw .c{position:relative}.sw .c button{position:absolute;right:-6px;top:-8px;padding:0 4px;font-size:11px;line-height:14px;border-radius:8px}
#cen{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
#bar label{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:13px}
#stage{flex:1;min-height:0;overflow:hidden;position:relative;background:repeating-conic-gradient(#d9dee2 0 25%,#e7ebee 0 50%) 0 0/20px 20px}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 6px 28px rgba(0,0,0,.35);background:#000}
#wrap iframe{border:0;display:block;background:#10102a}
#ov{position:absolute;inset:0;pointer-events:none}
.hd{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(42,143,120,.9);border:2px solid #fff;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:grab;pointer-events:auto;box-shadow:0 1px 6px rgba(0,0,0,.5);user-select:none}
.hd.sel{background:#e8a30c;transform:scale(1.2)}
#info{padding:5px 12px;color:var(--mu);font-size:12px;background:var(--pn);border-top:1px solid var(--bd)}
#msg{color:var(--wa);font-size:12.5px;margin:4px 0}
.ok{color:var(--ac2)}
</style>
</head>
<body>
<header>
  <h1>🎨 Editor de temas de las TV</h1>
  <label>Tema <select id="selTema"></select></label>
  <button id="bNuevo" class="pri">+ Nuevo</button>
  <select id="selPlantilla" title="Empezar desde una plantilla"><option value="">Plantilla…</option></select>
  <button id="bDup">Duplicar</button>
  <button id="bDel" class="del">Eliminar</button>
  <span style="flex:1"></span>
  <button id="bAbrir">Abrir JSON…</button>
  <button id="bDesc" class="pri">⬇ Descargar temas_custom.json</button>
  <input type="file" id="fAbrir" accept=".json,application/json" hidden>
</header>
<main>
  <div id="side"></div>
  <div id="cen">
    <div id="bar">
      <label>Pantalla
        <select id="selRes">
          <option value="1280x720">1280×720 · TV del hotel</option>
          <option value="1920x1080">1920×1080 · Full HD</option>
          <option value="1366x768">1366×768</option>
          <option value="1024x768">1024×768 · 4:3</option>
          <option value="2560x1080">2560×1080 · panorámica</option>
          <option value="720x1280">720×1280 · vertical</option>
          <option value="1080x1920">1080×1920 · vertical</option>
        </select>
      </label>
      <label><input type="checkbox" id="chDemo" checked> Datos de ejemplo</label>
      <label><input type="checkbox" id="chGuias" checked> Asas para arrastrar</label>
      <label><input type="checkbox" id="chSin"> Ver sin tema</label>
      <label>Página TV <input type="text" id="tUrl" value="index.html" style="width:150px"></label>
      <span id="esc" style="color:var(--mu);font-size:12px"></span>
    </div>
    <div id="stage"><div id="wrap"><iframe id="fr"></iframe><div id="ov"></div></div></div>
    <div id="info">Arrastra las asas verdes sobre la vista previa para mover las piezas. Las tarjetas de las piscinas se dibujan encima del fondo: coloca las piezas en las zonas libres (bordes, arriba y abajo).</div>
  </div>
</main>
<script>

    k.push(fld(p,'s','num',{lbl:'Tamaño',min:.3,max:5,step:.05,def:1}),fld(p,'rot','num',{lbl:'Giro °',min:-180,max:180,def:0}),fld(p,'espejo','chk',{lbl:'Espejo',txt:' voltear'}),fld(p,'c1','color',{lbl:'Color 1',def:IC[p.n]?IC[p.n][1]:'#ffffff'}),fld(p,'c2','color',{lbl:'Color 2',def:IC[p.n]?IC[p.n][2]:'#ffffff'}),fld(p,'anim','sel',{lbl:'Movimiento',def:'',o:ANIM}));
  } else if(p.t==='texto'){
    k.push(fld(p,'txt','text',{lbl:'Texto'})); k=k.concat(pos());
    k.push(fld(p,'s','num',{lbl:'Tamaño',min:.3,max:6,step:.05,def:1}),fld(p,'rot','num',{lbl:'Giro °',min:-90,max:90,def:0}),fld(p,'fuente','sel',{lbl:'Letra',def:'serif',o:[['serif','Con serifa'],['sans','Sin serifa'],['cursiva','Cursiva'],['mono','Monoespaciada']]}),fld(p,'c','color',{lbl:'Color',def:'#ffffff'}),fld(p,'borde','color',{lbl:'Contorno',def:'#000000',vacio:true}),fld(p,'anim','sel',{lbl:'Movimiento',def:'',o:ANIM}));
  } else if(p.t==='banderines' || p.t==='luces'){
    k.push(fld(p,'y','num',{lbl:'Altura %',min:0,max:60,step:.5,def:8}),fld(p,'de','num',{lbl:'Desde %',min:0,max:100,def:0}),fld(p,'a','num',{lbl:'Hasta %',min:0,max:100,def:100}),fld(p,'n','num',{lbl:'Cantidad',min:4,max:40,def:16}),fld(p,'caida','num',{lbl:'Caída del hilo',min:0,max:160,def:55}));
    if(p.t==='banderines') k.push(fld(p,'largo','num',{lbl:'Tamaño bandera',min:20,max:110,def:50}));
    k.push(colores(p,'cols',p.t==='luces'?['#ffd23f','#ff4f8b','#4aa3e0','#6bdc7a']:['#e8433f','#ffffff']));
  } else if(p.t==='lluvia'){
    k.push(fld(p,'tipo','sel',{lbl:'Tipo',def:'confeti',o:[['confeti','Confeti'],['globos','Globos que suben'],['copos','Copos de nieve'],['petalos','Pétalos'],['corazones','Corazones'],['burbujas','Burbujas'],['brasas','Brasas / chispas']]}),fld(p,'cant','num',{lbl:'Cantidad',min:3,max:80,def:30}));
    if(!/corazones|burbujas|brasas/.test(p.tipo||'confeti')) k.push(colores(p,'cols',['#ffffff','#ffd23f','#ff4f8b','#4aa3e0']));
  } else if(p.t==='estrellas'){
    k.push(fld(p,'cant','num',{lbl:'Cantidad',min:5,max:200,def:60}),fld(p,'ymax','num',{lbl:'Hasta altura %',min:5,max:100,def:50}),fld(p,'c','color',{lbl:'Color',def:'#ffffff'}));
  } else if(p.t==='nubes'){
    k.push(fld(p,'y','num',{lbl:'Altura %',min:0,max:80,def:15}),fld(p,'cant','num',{lbl:'Cantidad',min:1,max:8,def:3}),fld(p,'s','num',{lbl:'Tamaño',min:.3,max:2.5,step:.05,def:1}));
  }
  k.forEach(function(e){ if(e) b.appendChild(e); }); return b;
}

/* ── vista previa ── */
var RES=[1280,720];
function geoPrev(){ var w=RES[0], hh=RES[1], asp=w/hh, a=Math.min(asp,16/9), px=Math.max(w/1600,hh/900); return {w:w,h:hh,x0:800-450*a,W:900*a,px:px}; }
function ajustaEscala(){
  var st=$('stage'), aw=st.clientWidth-24, ah=st.clientHeight-24, sc=Math.min(1,aw/RES[0],ah/RES[1]);
  var wr=$('wrap'); wr.style.width=RES[0]+'px'; wr.style.height=RES[1]+'px'; wr.style.transform='scale('+sc+')';
  wr.style.left=Math.max(12,(st.clientWidth-RES[0]*sc)/2)+'px'; wr.style.top=Math.max(12,(st.clientHeight-RES[1]*sc)/2)+'px';
  var f=$('fr'); f.style.width=RES[0]+'px'; f.style.height=RES[1]+'px'; wr.dataset.sc=sc;
  $('esc').textContent='Escala de la vista: '+Math.round(sc*100)+' % · la TV real ve '+RES[0]+'×'+RES[1];
  pintaAsas();
}
function cargaFrame(){ listo=false; var u=($('tUrl').value||'index.html'), q='tv=1&lang=esp&editor=1'+($('chDemo').checked?'&demo=4':''); $('fr').src=u+(u.indexOf('?')<0?'?':'&')+q+'&_='+Date.now(); }
$('fr').addEventListener('load',function(){ setTimeout(function(){ listo=true; enviar(); },700); });
window.addEventListener('message',function(e){ if(e.data&&e.data.tmListo){ listo=true; enviar(); } });
function pintaAsas(){
  var ov=$('ov'); ov.innerHTML=''; var t=T(); if(!t||!$('chGuias').checked||$('chSin').checked) return;
  var g=geoPrev();
  (t.piezas||[]).forEach(function(p,i){ if(p.t!=='icono'&&p.t!=='texto') return;
    var cx=g.x0+g.W*(p.x==null?50:p.x)/100, cy=900*(p.y==null?50:p.y)/100, sx=(cx-800)*g.px+g.w/2, sy=(cy-450)*g.px+g.h/2;
    var a=h('div',{cls:'hd'+(i===selP?' sel':''),title:nombrePieza(p),txt:String(i+1)}); a.style.left=sx+'px'; a.style.top=sy+'px';
    a.addEventListener('pointerdown',function(ev){ ev.preventDefault(); a.setPointerCapture(ev.pointerId); selP=i; var sc=parseFloat($('wrap').dataset.sc)||1, r=$('wrap').getBoundingClientRect();
      var mv=function(e2){ var X=(e2.clientX-r.left)/sc, Y=(e2.clientY-r.top)/sc, nx=((X-g.w/2)/g.px+800-g.x0)/g.W*100, ny=((Y-g.h/2)/g.px+450)/900*100; p.x=Math.round(Math.max(-10,Math.min(110,nx))*10)/10; p.y=Math.round(Math.max(-10,Math.min(110,ny))*10)/10; a.style.left=X+'px'; a.style.top=Y+'px'; touch(true); };
      var up=function(){ a.removeEventListener('pointermove',mv); a.removeEventListener('pointerup',up); rehacer(); pintaAsas(); };
      a.addEventListener('pointermove',mv); a.addEventListener('pointerup',up); rehacer(); });
    ov.appendChild(a); });
}

/* ── lista de temas, archivos ── */
function listaTemas(){ var s=$('selTema'); s.innerHTML=''; var ks=Object.keys(DATA.temas); if(!ks.length) s.appendChild(h('option',{value:'',txt:'(ninguno)'})); ks.forEach(function(k){ var o=h('option',{value:k,txt:(DATA.temas[k].nombre||k)+'  ·  '+k}); if(k===curId) o.selected=true; s.appendChild(o); }); }
function elige(id){ curId=id; selP=-1; listaTemas(); rehacer(); enviar(); pintaAsas(); }
$('selTema').onchange=function(){ elige($('selTema').value); };
$('bNuevo').onclick=function(){ var n=prompt('Nombre del tema nuevo:','Mi tema'); if(!n) return; var id=idLibre(n); DATA.temas[id]=nuevoVacio(n); touch(); elige(id); };
$('bDup').onclick=function(){ if(!T()) return; var c=clone(T()); c.nombre=(c.nombre||curId)+' (copia)'; var id=idLibre(c.nombre); DATA.temas[id]=c; touch(); elige(id); };
$('bDel').onclick=function(){ if(!T()||!confirm('¿Eliminar el tema «'+(T().nombre||curId)+'»? (No se borra nada hasta que subas el archivo.)')) return; delete DATA.temas[curId]; var ks=Object.keys(DATA.temas); touch(); elige(ks[0]||''); };
var sp=$('selPlantilla'); [['navidad','Navidad'],['playa','Fiesta en la playa'],['fiesta','Fiesta (discoteca)']].forEach(function(p){ sp.appendChild(h('option',{value:p[0],txt:p[1]})); });
sp.onchange=function(){ var k=sp.value; sp.value=''; if(!k) return; var c=clone(PLANT[k]); c.fechas=[]; c.semanal=[]; var id=idLibre(c.nombre); DATA.temas[id]=c; touch(); elige(id); };
$('bAbrir').onclick=function(){ $('fAbrir').click(); };
$('fAbrir').onchange=function(){ var f=$('fAbrir').files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var j=JSON.parse(r.result), m=(j&&j.temas&&!Array.isArray(j.temas))?j.temas:j; if(!m||typeof m!=='object') throw 0; DATA={temas:m}; var ks=Object.keys(m); touch(); elige(ks[0]||''); }catch(e){ alert('No es un archivo de temas válido.'); } }; r.readAsText(f); $('fAbrir').value=''; };
$('bDesc').onclick=function(){ var txt=JSON.stringify(DATA,null,1), bl=new Blob([txt],{type:'application/json'}), a=h('a',{href:URL.createObjectURL(bl),download:'temas_custom.json'}); document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); dirty=false; };
$('selRes').onchange=function(){ var v=$('selRes').value.split('x'); RES=[+v[0],+v[1]]; ajustaEscala(); };
$('chDemo').onchange=cargaFrame; $('tUrl').onchange=cargaFrame; $('chGuias').onchange=pintaAsas; $('chSin').onchange=enviar;
window.addEventListener('resize',ajustaEscala);
window.addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ── arranque: lee temas_custom.json si existe; si no, el borrador guardado en este navegador ── */
function arranca(j){
  var m=j&&(j.temas&&!Array.isArray(j.temas)?j.temas:j); if(m&&typeof m==='object'&&Object.keys(m).length) DATA={temas:m};
  else { try{ var b=JSON.parse(localStorage.getItem('tm_editor_borrador')||'null'); if(b&&b.temas&&Object.keys(b.temas).length) DATA=b; }catch(e){} }
  var ks=Object.keys(DATA.temas); curId=ks[0]||''; listaTemas(); rehacer(); ajustaEscala(); cargaFrame();
}
if(location.protocol==='file:') arranca(null);
else fetch('temas_custom.json?_='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).then(arranca).catch(function(){ arranca(null); });
})();
